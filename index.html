<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171716">
    <title>Temporizador Pomio</title>
    <link rel="icon" type="image/png" href="assets/favicon.png?v=20260822.5">
    <link rel="stylesheet" href="styles/app.css?v=20260822.5">
  </head>
  <body>
    <a class="skip-link" href="#main">Ir a los temporizadores</a>
    <header class="app-header" aria-label="Herramientas del temporizador">
      <button class="header-button" type="button" data-action="create-timer"
        aria-label="Crear temporizador">
        <span class="header-icon" aria-hidden="true">◷</span>
        <span class="header-text">Temporizador</span>
      </button>
      <button class="header-button" type="button" data-action="open-sounds"
        aria-label="Abrir sonidos">
        <span class="header-icon" aria-hidden="true">♫</span>
        <span class="header-text">Sonidos</span>
      </button>
    </header>

    <main id="main" tabindex="-1">
      <div id="timers" aria-live="polite">
        <p class="empty-state">Crea un temporizador para comenzar tu rutina.</p>
      </div>
    </main>

    <dialog id="timer-dialog" aria-labelledby="timer-dialog-title">
      <form id="timer-form" method="dialog">
        <div class="dialog-heading">
          <h2 id="timer-dialog-title">Crear temporizador</h2>
          <button class="icon-button" type="button" data-action="close-dialog"
            aria-label="Cerrar">×</button>
        </div>
        <label>Nombre <input name="name" maxlength="50" required></label>
        <label>Emoji <input name="emoji" maxlength="8" inputmode="text"></label>
        <fieldset class="mode-picker">
          <legend>Configuración del tiempo</legend>
          <label><input type="radio" name="kind" value="normal" checked> Horas y minutos</label>
          <label><input type="radio" name="kind" value="pomodoro"> Horas completas con descanso</label>
        </fieldset>
        <div data-fields="normal">
          <label>Horas <input name="hours" type="number" min="0" value="0"></label>
          <label>Minutos <input name="minutes" type="number" min="0" max="59" value="25"></label>
        </div>
        <div data-fields="pomodoro" hidden>
          <label>Horas completas <input name="pomodoroHours" type="number" min="1" step="1" value="1"></label>
          <label>Descanso por hora
            <select name="restMinutes">
              <option>5</option><option>10</option><option selected>15</option><option>20</option>
            </select>
          </label>
          <label class="check"><input name="autoAdvance" type="checkbox" checked> Continuar automáticamente</label>
        </div>
        <fieldset class="color-picker">
          <legend>Color del temporizador</legend>
          <div class="color-options" data-color-options="color"></div>
        </fieldset>
        <fieldset class="color-picker">
          <legend>Color del dial</legend>
          <div class="color-options" data-color-options="dialColor"></div>
        </fieldset>
        <menu>
          <button class="danger" type="button" data-action="delete-timer" hidden>Eliminar</button>
          <button type="button" data-action="close-dialog">Cancelar</button>
          <button class="primary" type="submit" value="save">Guardar</button>
        </menu>
      </form>
    </dialog>

    <dialog id="sounds-dialog" aria-labelledby="sounds-title">
      <form id="sounds-form" method="dialog">
        <div class="dialog-heading">
          <h2 id="sounds-title">Sonidos</h2>
          <button class="icon-button" type="button" data-action="close-dialog"
            aria-label="Cerrar">×</button>
        </div>
        <label>Sonido de fondo
          <select name="noise">
            <option value="off">Desactivado</option>
            <option value="rain">Lluvia intensa</option>
            <option value="static">Ruido blanco</option>
            <option value="ocean">Olas del mar</option>
            <option value="fan">Ventilador</option>
            <option value="gamma">Onda gamma (40 Hz)</option>
          </select>
        </label>
        <label>Volumen de fondo <input name="noiseVolume" type="range" min="0" max="1" step="0.05"></label>
        <label>Volumen de alertas <input name="alertVolume" type="range" min="0" max="1" step="0.05"></label>
        <label class="check"><input name="repeatUntilContinue" type="checkbox"> Repetir hasta continuar</label>
        <menu>
          <button type="button" data-action="close-dialog">Cancelar</button>
          <button class="primary" type="submit" value="save">Guardar</button>
        </menu>
      </form>
    </dialog>
    <div class="sr-only" id="announcer" aria-live="assertive"></div>
    <script type="module" src="src/app.js?v=20260822.5"></script>
  </body>
</html>
